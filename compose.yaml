# TAG lives in .env and is written by deploy.sh: the commit SHA = the image tag in GHCR.
# ${TAG:?} fails loudly instead of pulling a random tag.
services:
  # shortcut: migrator and app use the same DB user financebot; a separate DDL user comes with multi-user (Phase 7)
  migrator:
    image: ghcr.io/yahorhurski/telegram-finance-bot-migrator:${TAG:?TAG is not set in .env}
    restart: "no"                          # one-shot: never restarted after exit 0
    environment:
      ASPNETCORE_ENVIRONMENT: Production   # EF bundles default to Development otherwise (appsettings.Development.json)
      ConnectionStrings__Default: Host=postgres;Database=financebot;Username=financebot;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
    depends_on:
      postgres: { condition: service_healthy }

  app:
    image: ghcr.io/yahorhurski/telegram-finance-bot:${TAG:?TAG is not set in .env}
    restart: unless-stopped
    # Explicit list instead of the whole .env: the app does not need the B2 key and other backup variables
    environment:
      ConnectionStrings__Default: Host=postgres;Database=financebot;Username=financebot;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      Bot__IngestToken: ${Bot__IngestToken}
      Bot__TelegramToken: ${Bot__TelegramToken}
      Bot__OwnerChatId: ${Bot__OwnerChatId}
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    # no ports: only Caddy talks to the app, inside the compose network

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financebot
      POSTGRES_DB: financebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql     # PG18+ moved the volume here; the old .../data path loses data on recreate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financebot -d financebot"]
      interval: 5s
      retries: 12
    # no ports: the database is reachable only inside the compose network

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]        # the only public entry point
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data               # certificates survive container recreation (Let's Encrypt rate limits)
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
